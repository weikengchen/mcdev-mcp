name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-java26:
    name: Build once on Java 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - name: Test and produce the Java 26 provenance payload
        run: >-
          ./gradlew clean test check shadowJar runtimeTestBundle benchmarkBundle
          java26ArtifactBundle --rerun-tasks --no-build-cache --no-configuration-cache --console=plain
      - name: Verify staged JAR checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/artifacts/java26
          test "$(find . -maxdepth 1 -name 'mcdev-mcp-*.jar' -type f | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'mcdev-mcp-*.jar.sha256' -type f | wc -l)" -eq 1
          sha256sum --check mcdev-mcp-*.jar.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java26-build
          path: build/artifacts/java26/*
          if-no-files-found: error
          retention-days: 7

  parity:
    name: Frozen Node parity
    needs: build-java26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java26-build
          path: downloaded
      - name: Stage the checksum-verified producer JAR for parity
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          test -n "$version"
          (cd downloaded && sha256sum --check "mcdev-mcp-$version.jar.sha256")
          mkdir -p build/libs
          cp "downloaded/mcdev-mcp-$version.jar" "downloaded/mcdev-mcp-$version.jar.sha256" build/libs/
      - name: Materialize the immutable master oracle worktree
        shell: bash
        run: |
          set -euo pipefail
          oracle_commit='7b98bdb4a1d885d588cd141d8eb21e3c5c18b2b6'
          oracle_worktree="$RUNNER_TEMP/mcdev-mcp-node-oracle"
          git checkout --detach "$GITHUB_SHA"
          git branch -f master "$oracle_commit"
          git worktree add "$oracle_worktree" master
          test "$(git -C "$oracle_worktree" rev-parse HEAD)" = "$oracle_commit"
          test -z "$(git -C "$oracle_worktree" status --porcelain=v1 --untracked-files=all)"
      - name: Compare the Java CLI and complete MCP surface with the frozen Node server
        run: ./gradlew parityTest --rerun-tasks -x test -x shadowJar --no-configuration-cache --console=plain
      - name: Verify parity preserved the producer JAR
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          cd build/libs
          sha256sum --check "$GITHUB_WORKSPACE/downloaded/mcdev-mcp-$version.jar.sha256"
          cmp "mcdev-mcp-$version.jar" "$GITHUB_WORKSPACE/downloaded/mcdev-mcp-$version.jar"

  runtime-matrix:
    name: Exact JAR on ${{ matrix.os }} Java ${{ matrix.java }}
    needs: build-java26
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '26'
          - os: macos-latest
            java: '26'
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java26-build
          path: downloaded
      - name: Verify and execute the compiled runtime harness
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(downloaded/mcdev-mcp-runtime-test-*.zip)
          test "${#bundles[@]}" -eq 1
          rm -rf runtime
          mkdir runtime
          unzip -q "${bundles[0]}" -d runtime
          cd runtime/server
          checksums=(mcdev-mcp-*.jar.sha256)
          test "${#checksums[@]}" -eq 1
          recorded="$(awk '{print $1}' "${checksums[0]}")"
          jars=(mcdev-mcp-*.jar)
          test "${#jars[@]}" -eq 1
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${jars[0]}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${jars[0]}" | awk '{print $1}')"
          fi
          test "$actual" = "$recorded"
          cd ../..
          java --enable-preview --illegal-native-access=deny \
            -cp "runtime/harness:runtime/server/${jars[0]#./}" \
            dev.mcdevmcp.packaging.RuntimeArtifactSmokeMain \
            "runtime/server/${jars[0]#./}"

  mcpb:
    name: Pack exact Java 26 JAR as MCPB
    needs: build-java26
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packaging/mcpb/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java26-build
          path: downloaded
      - name: Pack, extract, and smoke the downloaded bytes
        shell: pwsh
        run: |
          $jar = @(Get-ChildItem downloaded\mcdev-mcp-*.jar)
          $checksum = @(Get-ChildItem downloaded\mcdev-mcp-*.jar.sha256)
          if ($jar.Count -ne 1 -or $checksum.Count -ne 1) { throw "Expected one JAR and checksum" }
          .\scripts\build-mcpb.ps1 -SkipBuild -Jar $jar[0].FullName -Checksum $checksum[0].FullName -Manifest downloaded\manifest.json
          Copy-Item $jar[0].FullName build\distributions\$($jar[0].Name)
          Copy-Item $checksum[0].FullName build\distributions\$($checksum[0].Name)
          $version = (Get-Content gradle.properties | Where-Object { $_ -like 'version=*' }).Substring(8)
          .\scripts\verify-release-assets.ps1 -DryRun -Version $version -Directory build\distributions
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: build/distributions/*.mcpb
          if-no-files-found: error

  conformance:
    name: Official MCP conformance 0.1.16
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Run pinned official MCP conformance
        shell: pwsh
        run: .\scripts\run-conformance.ps1
